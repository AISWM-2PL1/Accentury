<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사투리 억양 테스트</title>
    <!--
      바탕 스타일은 src/tokens.css의 body 규칙이 갖는다 (KAN-148). 여기에 색을 적어 두면
      토큰과 별개로 움직이는 두 번째 출처가 생긴다.

      배경색만 먼저 칠해 두는 이유: 번들이 로드되기 전 한 프레임 동안 흰 바탕이 비치는데,
      크림 화면에서는 그 한 프레임이 눈에 띄게 번쩍인다. 값은 --color-background와 같다.

      다크 분기는 없다 (KAN-161) - tokens.css·Theme.kt와 같은 결정이라 시스템 다크에서도
      이 크림 한 색으로 시작한다.
    -->
    <style>
      html {
        background: #f3ecd9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
