# 웹 번들 S3 배포 (KAN-127)
#
# 승격 흐름 (2026-08-17 확정): Dev 병합은 staging 버킷, Release 병합은 prod 버킷. 빌드 산출물은
# 환경 무관이라(화면과 API가 같은 출처, 베이스 URL 주입 없음) 두 환경이 같은 빌드 절차를 쓴다.
#
# 자격 증명은 GitHub OIDC로 환경별 IAM 역할(accentury-{env}-github-deploy, infra/modules/deploy)을
# 맡는다. 장기 액세스 키를 시크릿에 두지 않는다. 역할의 신뢰 정책이 sub를
# repo:OWNER/REPO:environment:{env}로 묶으므로 job이 반드시 `environment:`를 지정해야 한다.
# 대상 값(역할 ARN, 버킷, 배포 ID)은 그 environment의 변수다 (infra/README.md "GitHub 설정").
#
# 캐시 전략: 해시가 붙은 자산(assets/*)은 immutable 장기 캐시, index.html만 no-cache. 업로드
# 순서가 곧 원자성이다 - 자산을 먼저 올리고 index.html을 마지막에 바꾼다. 중간에 실패하면 이전
# index.html이 이전 자산을 그대로 가리킨다 (AC "실패 시 이전 상태 유지"). sync --delete를 쓰지
# 않는다: 구 index.html을 아직 든 브라우저가 이전 자산을 받아야 하고, 등급 이미지(KAN-132)와
# 개인정보처리방침(KAN-133)이 같은 버킷에 산다. 역할에 DeleteObject 권한도 없다.
#
# test.yml과 중복 실행하지 않는다: 저쪽은 pull_request, 여기는 push(병합 결과)다. 테스트 게이트는
# PR의 web-test required check(Dev Ruleset)가 맡고, 여기서는 tsc + vite build만 다시 돈다.
#
# 환경이 철거된 상태(staging은 미사용 시 destroy, KAN-140)에서는 역할도 버킷도 없어 자격 증명
# 단계가 "Not authorized to perform sts:AssumeRoleWithWebIdentity"로 실패한다 - 신뢰 정책 결함과
# 구분이 안 되는 메시지다 (2026-08-27 PR #55 리뷰). 철거할 때 environment 변수 DEPLOY_PAUSED=true를
# 두면 이 워크플로는 빌드까지만 하고 배포 단계를 건너뛴 채 성공으로 끝나며, 요약에 그 사실을 남긴다.
# 재구축 뒤 변수를 지우면 다시 배포한다 (infra/README.md "teardown 절차", "GitHub 설정").

name: Web Deploy

on:
  push:
    branches: [Dev, Release]
    # push 이벤트라 워크플로 레벨 paths를 써도 된다. required check 잠김 문제(test.yml 주석)는
    # pull_request 검사에만 해당한다.
    paths:
      - 'web/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 대상 환경. 환경을 새로 지은 뒤 첫 배포나 웹 변경 없는 재배포에 쓴다.
        required: true
        type: choice
        options: [staging, prod]
        default: staging

# 같은 환경으로 가는 실행이 겹치면 index.html 교체 순서가 꼬인다. 뒤쪽이 기다린다 (취소 안 함).
concurrency:
  group: web-deploy-${{ inputs.environment || (github.ref_name == 'Release' && 'prod' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Release 푸시 = prod, Dev 푸시 = staging. 수동 실행은 입력값이 이긴다.
    environment: ${{ inputs.environment || (github.ref_name == 'Release' && 'prod' || 'staging') }}
    defaults:
      run:
        working-directory: web
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # tsc --noEmit + vite build.
      #
      # 환경을 아는 값이 넷이다. 나머지는 그대로 - 산출물이 환경을 몰라야 한다는 원칙(KAN-127)에서
      # 이것들만 빼는 이유가 각각 있다.
      #
      # GA4 측정 ID (KAN-33): 계측이 환경별로 갈려야 한다. staging과 prod가 같은 ID를 쓰면
      # 우리가 확인하느라 도는 트래픽이 실사용 집계에 섞이고, 그러면 KAN-24(대기 시간)·KAN-21
      # (등급 분포) 트리거의 판단 근거가 오염된다.
      #
      # 지역 선택 스위치 (KAN-202): 출신 지역 선택 화면과 세션 생성 본문의 `region` 필드를 켜는
      # 빌드 변수다. 지역은 KAN-201 학습 데이터의 라벨이라 내부 테스터가 응시하는 staging에만
      # 필요하고, 사용자에게 주는 기능이 아니라 prod 번들에는 화면도 요청 필드도 없어야 한다.
      # 그래서 staging environment에만 `REGION_SELECT=true`를 두고 **prod에는 변수를 만들지
      # 않는다.** 코드는 문자열 `true`일 때만 켠다 (web/src/region/regions.ts) - `1`이나 `TRUE`는
      # 꺼진 것과 같다.
      #
      # 광고 ID 둘 (KAN-197): AdSense 게시자 ID와 광고 단위 슬롯 ID다. 환경별인 이유가 계측과
      # 다르다 - 섞이면 곤란해서가 아니라 **승인 대상이 prod 하나**이기 때문이다. AdSense는 심사를
      # 통과한 사이트에만 광고를 내려주므로 staging에는 변수를 두지 않는다. 그 환경은 태그도 슬롯도
      # 없는 빌드가 나오고 그것이 정상 상태다 (web/src/ads/adsense.ts의 `adSenseIdsFromEnv`가 null,
      # docs/wiki/ads-web-adsense.md §6). **둘 다 있어야 켜진다** - 하나만 준 빌드는 값이 없는 빌드와
      # 같다. 반쪽 설정이 「태그는 떴는데 빈 칸」으로 나타나면 승인 전 상태와 구분이 안 되기 때문이다.
      #
      # **비어 있는 것이 정상 상태다.** 변수를 두지 않은 환경은 계측 없이(web/src/analytics/ga4.ts),
      # 지역 화면 없이, 광고 없이 빌드된다. 넷 다 페이지 소스에 박히는 공개 값이라 시크릿이 아니라
      # 변수로 둔다.
      - run: npm run build
        env:
          VITE_GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          VITE_REGION_SELECT: ${{ vars.REGION_SELECT }}
          VITE_ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
          VITE_ADSENSE_SLOT_ID: ${{ vars.ADSENSE_SLOT_ID }}

      # ads.txt는 빌드 산출물이 아니라 배포 값이라 여기서 만든다 (KAN-197).
      #
      # web/public/에 정적 파일로 두지 않는 근거가 둘이다. 파일에 적히는 게시자 ID가 environment
      # 변수라 레포에 박으면 staging에도 같은 값이 실리고, 무엇보다 **가짜 ID가 적힌 ads.txt는
      # 해롭다** - AdSense가 그 도메인을 「승인되지 않은 판매자」로 읽는다. 값이 없으면 파일을 아예
      # 만들지 않는 쪽이 안전하다.
      #
      # 형식은 네 칸짜리 한 줄이고 인증 기관 ID `f08c47fec0942fa0`은 Google이 정한 고정 값이다
      # (https://support.google.com/adsense/answer/7532444, 2026-09-13 재확인). **접두어가 `pub-`이지
      # `ca-pub-`이 아니라서** 빌드 변수의 값에서 `ca-`를 뗀다. 모양을 여기서 검사하고 어긋나면
      # 실패시키는 이유가 그 한 글자다 - 틀린 게시자 ID가 적힌 파일이 조용히 올라가면 소유권 확인이
      # 되지 않는데, 증상이 「심사가 아직 안 끝났다」와 구분되지 않아 몇 주를 잃는다.
      - name: ads.txt 생성 (KAN-197)
        id: adstxt
        env:
          ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
        run: |
          if [ -z "$ADSENSE_CLIENT_ID" ]; then
            echo "::notice title=ads.txt 없음::ADSENSE_CLIENT_ID가 비어 있어 ads.txt를 만들지 않습니다. 광고 없는 빌드의 정상 상태입니다 (docs/wiki/ads-web-adsense.md §6)."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$ADSENSE_CLIENT_ID" in
            ca-pub-*) ;;
            *)
              echo "environment 변수 ADSENSE_CLIENT_ID는 ca-pub- 으로 시작해야 합니다. AdSense 콘솔의 게시자 ID를 그대로 넣으세요 - ads.txt에 적히는 pub- 는 이 단계가 ca-를 떼어 만듭니다 (docs/wiki/ads-web-adsense.md §6)." >&2
              exit 1
              ;;
          esac
          printf 'google.com, %s, DIRECT, f08c47fec0942fa0\n' "${ADSENSE_CLIENT_ID#ca-}" > dist/ads.txt
          echo "generated=true" >> "$GITHUB_OUTPUT"
          cat dist/ads.txt

      - name: 환경 철거 상태 확인
        id: gate
        env:
          DEPLOY_PAUSED: ${{ vars.DEPLOY_PAUSED }}
          TARGET: ${{ inputs.environment || (github.ref_name == 'Release' && 'prod' || 'staging') }}
        run: |
          if [ "$DEPLOY_PAUSED" = "true" ]; then
            echo "::notice title=배포 건너뜀::$TARGET 환경이 철거된 상태(DEPLOY_PAUSED=true)라 빌드만 하고 배포하지 않습니다. 재구축 뒤 environment 변수 DEPLOY_PAUSED를 지우면 다시 배포합니다."
            {
              echo "| 환경 | 커밋 | 결과 |"
              echo "| --- | --- | --- |"
              echo "| $TARGET | ${GITHUB_SHA} | 건너뜀 (환경 철거 중, DEPLOY_PAUSED=true) |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: environment 변수 확인
        if: steps.gate.outputs.paused != 'true'
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=0
          for name in AWS_DEPLOY_ROLE_ARN WEB_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "GitHub environment 변수가 비어 있습니다: $name (infra/README.md 'GitHub 설정')" >&2
              missing=1
            fi
          done
          exit "$missing"

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.gate.outputs.paused != 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 해시 자산 업로드 (immutable)
        if: steps.gate.outputs.paused != 'true'
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          # ads.txt도 뺀다 - index.html과 같은 부류라 아래에서 따로 올린다 (KAN-197)
          aws s3 sync dist/ "s3://$WEB_BUCKET/" \
            --exclude index.html \
            --exclude ads.txt \
            --cache-control 'public, max-age=31536000, immutable' \
            --no-progress

      - name: index.html 교체 (no-cache)
        if: steps.gate.outputs.paused != 'true'
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          aws s3 cp dist/index.html "s3://$WEB_BUCKET/index.html" \
            --cache-control 'no-cache' \
            --content-type 'text/html; charset=utf-8'

      # ads.txt가 index.html과 같은 부류인 이유는 이름이다 - 해시가 붙지 않아 내용이 바뀌어도
      # 주소가 그대로라, 장기 캐시를 걸면 게시자 ID를 갈아 끼운 뒤에도 옛 파일이 나간다. 위
      # sync에서 빼고 여기서 no-cache로 올린다. 순서는 index.html 뒤여도 된다 - 소유권 확인
      # 파일이라 번들의 원자성(자산 → index.html)과 얽히지 않는다.
      #
      # 값이 없어 파일을 만들지 않은 환경에서는 이 단계를 건너뛴다. 버킷에 이미 있던 ads.txt를
      # 지우지는 않는다 - sync에 --delete가 없는 것과 같고 역할에 DeleteObject 권한도 없다.
      # 광고를 내리려면 변수를 지우는 것으로 부족하고 객체를 따로 지워야 한다.
      - name: ads.txt 교체 (no-cache)
        if: steps.gate.outputs.paused != 'true' && steps.adstxt.outputs.generated == 'true'
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          aws s3 cp dist/ads.txt "s3://$WEB_BUCKET/ads.txt" \
            --cache-control 'no-cache' \
            --content-type 'text/plain; charset=utf-8'

      - name: CloudFront 무효화
        if: steps.gate.outputs.paused != 'true'
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          ADS_TXT_GENERATED: ${{ steps.adstxt.outputs.generated }}
        run: |
          # /는 default_root_object로 index.html을 받지만 캐시 키는 /다. 확장자 없는 경로는
          # SPA 재작성 Function이 /index.html로 바꿔 그 키를 쓴다 (KAN-126). 둘 다 지운다.
          # 해시 자산은 이름이 바뀌므로 무효화 대상이 아니다.
          paths=('/' '/index.html')
          # ads.txt는 방금 올렸을 때만 더한다 (KAN-197). 이름에 해시가 없어 무효화하지 않으면
          # 엣지가 옛 내용을 계속 내주고, AdSense는 그 옛 내용으로 소유권을 판정한다. 확장자가
          # 있어 SPA 재작성 Function을 타지 않으므로 캐시 키도 경로 그대로다.
          if [ "$ADS_TXT_GENERATED" = "true" ]; then
            paths+=('/ads.txt')
          fi
          id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "${paths[@]}" \
            --query Invalidation.Id --output text)
          echo "무효화 $id 완료 대기"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$id"

      # 어느 환경에 어느 커밋이 올라갔는지는 GitHub environment의 deployments 목록에도 남지만,
      # 실행 요약에 한 줄 적어 두면 목록을 열지 않고도 보인다.
      - name: 배포 기록
        if: steps.gate.outputs.paused != 'true'
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          {
            echo "| 환경 | 커밋 | 버킷 |"
            echo "| --- | --- | --- |"
            echo "| ${{ inputs.environment || (github.ref_name == 'Release' && 'prod' || 'staging') }} | ${GITHUB_SHA} | ${WEB_BUCKET} |"
          } >> "$GITHUB_STEP_SUMMARY"
