name: Test

on:
  pull_request:

# 경로 필터는 워크플로 레벨 paths가 아니라 job 레벨 if 스킵으로 처리한다.
# 워크플로 레벨 paths는 미실행 시 required check가 Expected 상태로 남아 병합을 영구히 잠그지만,
# if로 스킵된 job은 통과로 취급되어 Ruleset required check와 안전하게 결합된다.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ios: ${{ steps.filter.outputs.ios }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      # pull_request 이벤트에서는 checkout 없이 GitHub API로 변경 파일을 조회한다
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/test.yml'
            # 안드로이드와 달리 한 줄이면 끝난다 - iOS는 ios/ 밖을 읽지 않는다. gradle/**처럼
            # 공유되는 빌드 파일이 없고, 가짜 마이크 WAV도 ios/Accentury/DebugResources/에
            # 따로 산다 (안드로이드 쪽 자산과 바이트는 같지만 파일은 별개다).
            ios:
              - 'ios/**'
              - '.github/workflows/test.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/test.yml'
            web:
              - 'web/**'
              - '.github/workflows/test.yml'
            ai:
              - 'ai/**'
              - '.github/workflows/test.yml'
            # CloudFront Function과 App Link 검증 파일 (KAN-32 4단계). AndroidManifest가 여기
            # 끼는 이유는 락스텝 테스트가 그 파일을 직접 읽어 AASA의 경로 집합과 대조하기
            # 때문이다 - 매니페스트만 바꾸면 app-test가 아니라 이 job이 먼저 깨져야 한다.
            infra:
              - 'infra/modules/edge/**'
              - 'infra/well-known/**'
              - 'infra/privacy/**'
              - 'app/src/main/AndroidManifest.xml'
              - '.github/workflows/test.yml'

  app-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest

  # app-test의 iOS 대응물 (KAN-37). macos-26을 박는 이유는 Xcode 26.x가 거기에만 있어서다 -
  # macos-15는 Xcode 16.x라 이 프로젝트를 열지 못한다 (ios/README.md 「필요한 것」).
  #
  # macOS 러너는 리눅스의 10배로 과금된다. 그래서 위 필터로 ios/**가 바뀐 PR에서만 돌리고,
  # job도 하나만 둔다 - 스킴 Accentury의 test 액션이 앱 계층(AccenturyTests)과 순수 Swift
  # 계층(AccenturyCoreTests)을 함께 돌리므로, `swift test` job을 따로 붙이면 같은 테스트를
  # 두 번 세면서 러너 시간만 더 쓴다 (ios/project.yml의 schemes.Accentury.test).
  #
  # xcodegen은 돌리지 않는다. 커밋된 Accentury.xcodeproj를 그대로 쓰면 brew 설치가 한 단계
  # 없어지고, 러너가 여는 프로젝트가 리뷰에 올라온 그 파일이 된다.
  #
  # 아직 required check로 올리지 않는다 (edge-test와 같은 취급 - 안정화 후 별도 결정).
  ios-test:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # 러너 이미지는 예고 없이 갈린다. 실패가 우리 코드인지 도구 버전인지 가르는 첫 줄이라
      # 로그 맨 앞에 남겨 둔다.
      - name: 도구 버전
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # 시뮬레이터 기기 이름은 이미지마다 다르다 - 로컬처럼 'iPhone 17 Pro'를 박아 두면
      # 이미지가 올라가는 날 destination을 못 찾아 죽는다. 가용 목록에서 골라 UDID로 준다.
      #
      # `// empty`가 있어야 아래 -z 검사가 산다. 목록이 비면 last가 null이 되고 jq -r는 그걸
      # 네 글자 "null"로 찍어서, 없는 기기를 찾았다고 착각한 채 grep에서 엉뚱하게 죽는다.
      - name: 시뮬레이터 고르기
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | sort_by(.name) | last | .udid // empty')
          if [ -z "$udid" ]; then
            echo "가용 iPhone 시뮬레이터가 없다 - 러너 이미지를 확인할 것"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # CODE_SIGNING_ALLOWED=NO - 팀 ID가 든 Local.xcconfig는 gitignore라 CI에 없고, 그게
      # 정상 상태다. 시뮬레이터 빌드는 서명이 필요 없으므로 이 한 줄로 넘어간다.
      #
      # xcbeautify는 러너 이미지에 들어 있지만 없어도 돌게 두고, pipefail로 xcodebuild의
      # 실패가 파이프에 먹히지 않게 한다.
      - name: 단위 테스트
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          run_tests() {
            xcodebuild -project Accentury.xcodeproj -scheme Accentury -configuration Debug \
              -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO \
              -resultBundlePath TestResults.xcresult test
          }
          if command -v xcbeautify >/dev/null; then
            run_tests | xcbeautify --renderer github-actions
          else
            run_tests
          fi

      # xcresult에는 테스트별 로그와 실패 지점이 들어 있다. 콘솔 출력만으로는 재구성이 안 되므로
      # 러너가 사라지기 전에 건져 둔다.
      - name: 실패 증거 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # 백엔드 테스트는 Testcontainers PostgreSQL로 실행 (KAN-123) - ubuntu-latest 러너의
      # 기본 Docker를 그대로 쓴다. 스키마는 Flyway V1이 만들고 Hibernate validate가
      # 대조하므로, 이 job 통과가 곧 "마이그레이션이 실제 PostgreSQL에 적용된다"의 검증이다 (티켓 AC).
      - run: ./gradlew test
        working-directory: backend

  web-test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # tsc --noEmit + vite build - 타입 오류와 번들 실패를 PR에서 잡는다
      - run: npm run build

  # 브라우저 E2E (KAN-181)는 2026-09-05에 CI에서 내렸다 (KAN-22). 그 job은 로컬 풀스택
  # (DB + AI + BE) 위에서 돌았는데, AI 서버의 베이스가 채점 모델 전달본이 되면서 러너에서
  # 띄울 수 없게 됐다 - 4GB 이미지에 RSS 7GB대이고 추론 1건이 14~30초다. 스펙 파일
  # (web/e2e)은 남겨 두었고, 분석이 필요한 전 구간 확인은 staging 스모크가 맡는다
  # (deploy.yml). 2026-09-06에 루트 compose의 ai가 가짜 엔진(ai/Dockerfile.fake, slim)으로
  # 되살아나 러너에서도 뜨므로, 이 job을 되살리는 것은 별도 결정이다 (PR #87 리뷰).

  # SPA 재작성 Function과 App Link 검증 파일 (KAN-32 4단계). 의존성이 없어 setup-node만으로
  # 돌고 몇 초 만에 끝난다 - CloudFront Function은 배포해야만 도는 코드라 이 job이 없으면
  # `/.well-known/` 예외가 깨져도 apply 뒤 curl 전까지 아무도 모른다.
  #
  # 아직 required check로 올리지 않는다 (안정화 후 별도 결정).
  edge-test:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 디렉터리 경로가 아니라 glob이다 - node 22.6부터 --test의 위치 인자는 glob으로 해석돼
      # 디렉터리를 주면 그 이름의 모듈을 찾다가 MODULE_NOT_FOUND로 죽는다.
      - run: node --test 'infra/modules/edge/*.test.mjs'
      # 개인정보처리방침 본문의 계약 테스트 (KAN-176). 같은 job에 둔 이유는 둘 다 배포해야만
      # 드러나는 정적 자산이고, 의존성 없이 몇 초면 끝나기 때문이다.
      - run: node --test 'infra/privacy/*.test.mjs'

  ai-test:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
