name: Test

on:
  pull_request:

# 경로 필터는 워크플로 레벨 paths가 아니라 job 레벨 if 스킵으로 처리한다.
# 워크플로 레벨 paths는 미실행 시 required check가 Expected 상태로 남아 병합을 영구히 잠그지만,
# if로 스킵된 job은 통과로 취급되어 Ruleset required check와 안전하게 결합된다.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      # pull_request 이벤트에서는 checkout 없이 GitHub API로 변경 파일을 조회한다
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/test.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/test.yml'
            web:
              - 'web/**'
              - '.github/workflows/test.yml'
            ai:
              - 'ai/**'
              - '.github/workflows/test.yml'
            # CloudFront Function과 App Link 검증 파일 (KAN-32 4단계). AndroidManifest가 여기
            # 끼는 이유는 락스텝 테스트가 그 파일을 직접 읽어 AASA의 경로 집합과 대조하기
            # 때문이다 - 매니페스트만 바꾸면 app-test가 아니라 이 job이 먼저 깨져야 한다.
            infra:
              - 'infra/modules/edge/**'
              - 'infra/well-known/**'
              - 'app/src/main/AndroidManifest.xml'
              - '.github/workflows/test.yml'

  app-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # 백엔드 테스트는 Testcontainers PostgreSQL로 실행 (KAN-123) - ubuntu-latest 러너의
      # 기본 Docker를 그대로 쓴다. 스키마는 Flyway V1이 만들고 Hibernate validate가
      # 대조하므로, 이 job 통과가 곧 "마이그레이션이 실제 PostgreSQL에 적용된다"의 검증이다 (티켓 AC).
      - run: ./gradlew test
        working-directory: backend

  web-test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # tsc --noEmit + vite build - 타입 오류와 번들 실패를 PR에서 잡는다
      - run: npm run build

  # 브라우저 E2E (KAN-181)는 2026-09-05에 CI에서 내렸다 (KAN-22). 그 job은 로컬 풀스택
  # (DB + AI + BE) 위에서 돌았는데, AI 서버의 베이스가 채점 모델 전달본이 되면서 러너에서
  # 띄울 수 없게 됐다 - 4GB 이미지에 RSS 7GB대이고 추론 1건이 14~30초다. 스펙 파일
  # (web/e2e)은 남겨 두었고, 분석이 필요한 전 구간 확인은 staging 스모크가 맡는다
  # (deploy.yml). 되살리려면 러너가 감당할 수 있는 AI 대역이 먼저 있어야 한다.

  # SPA 재작성 Function과 App Link 검증 파일 (KAN-32 4단계). 의존성이 없어 setup-node만으로
  # 돌고 몇 초 만에 끝난다 - CloudFront Function은 배포해야만 도는 코드라 이 job이 없으면
  # `/.well-known/` 예외가 깨져도 apply 뒤 curl 전까지 아무도 모른다.
  #
  # 아직 required check로 올리지 않는다 (안정화 후 별도 결정).
  edge-test:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 디렉터리 경로가 아니라 glob이다 - node 22.6부터 --test의 위치 인자는 glob으로 해석돼
      # 디렉터리를 주면 그 이름의 모듈을 찾다가 MODULE_NOT_FOUND로 죽는다.
      - run: node --test 'infra/modules/edge/*.test.mjs'

  ai-test:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
