# XcodeGen 정의 파일. **이 파일이 원본이고 Accentury.xcodeproj는 산출물이다.**
# .xcodeproj도 커밋하지만(티켓 AC: Xcode 프로젝트가 레포에 있어야 한다) 손으로 고치지 않는다 —
# Xcode UI에서 만진 변경은 다음 `xcodegen generate` 때 조용히 사라진다.
# 빌드 설정을 바꿀 자리는 여기, 또는 Accentury/Config/*.xcconfig다.
name: Accentury

options:
  bundleIdPrefix: com.accentury
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # 아래 두 값의 정본은 Accentury/Config/Base.xcconfig다. 여기 한 번 더 두는 이유는
  # xcconfig가 붙지 않는 타깃(AccenturyTests)도 같은 하한·같은 Swift 버전으로 빌드하기 위해서다.
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

configs:
  Debug: debug
  Release: release

packages:
  AccenturyCore:
    path: AccenturyCore
  # 카카오톡 공유 SDK (KAN-180). 안드로이드 `libs.kakao.share`(v2-share) 자리다 — 다만 두
  # 플랫폼의 SDK 버전 계열이 따로 굴러서 번호는 맞지 않는다(안드로이드 2.24.0).
  #
  # 카카오 문서는 브랜치 master를 물라고 하지만 태그를 못 박는다: 브랜치를 물면 같은 커밋에서
  # 어제와 오늘의 빌드가 달라지고, 공유가 깨졌을 때 우리 변경인지 SDK 변경인지 가릴 수 없다.
  # 올릴 때는 이 한 줄을 고치고 시뮬레이터 빌드까지 확인한다.
  KakaoOpenSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    exactVersion: 2.29.0
  # 익명 계측·크래시 (KAN-33). 안드로이드 `libs.firebase.bom` 자리다 — 다만 SwiftPM에는 BoM이
  # 없고 저장소 하나가 모든 product의 버전을 함께 잡아서, 여기 적힌 한 줄이 그 역할을 한다.
  # 안드로이드 BoM(34.18.0)과 번호가 맞지 않는 것은 두 플랫폼의 배포 번호 체계가 따로여서다.
  #
  # 태그를 못 박는 이유는 KakaoOpenSDK와 같다: 브랜치를 물면 같은 커밋에서 어제와 오늘의 빌드가
  # 달라져, 계측이 끊겼을 때 우리 변경인지 SDK 변경인지 가릴 수 없다.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.18.0

targets:
  Accentury:
    type: application
    platform: iOS
    sources:
      - path: Accentury
        excludes:
          - "Info-Debug.plist"
          - "Info-Release.plist"
          - "Config"
      # 빌드 산출물이 아니라 설정 파일이라 컴파일·복사 대상이 아니다. Xcode 네비게이터에서
      # 열어 볼 수 있게 그룹으로만 넣는다. Local.xcconfig는 사람마다 다른 파일이라 제외한다 —
      # 넣으면 프로젝트 파일이 기계마다 갈린다.
      - path: Accentury/Info-Debug.plist
        buildPhase: none
      - path: Accentury/Info-Release.plist
        buildPhase: none
      - path: Accentury/Config
        buildPhase: none
        excludes:
          - "Local.xcconfig"
      # Accentury/GoogleService-Info.plist(KAN-33)를 여기 따로 적지 않는다. 위 폴더 스캔이
      # 이미 리소스로 잡아 가고(plist의 기본 buildPhase가 resources다 — Info-*.plist만 위에서
      # 예외로 뺐다), **그게 파일이 없어도 되는 유일한 방법**이다: 경로를 명시하면 XcodeGen이
      # 없는 파일을 참조로 만들고 빌드가 «Build input file cannot be found»로 죽는다.
      # 파일이 없는 것이 정상 상태라는 규칙(Accentury/Analytics/FirebaseEventSink.swift의
      # FirebaseSetup)은 그래서 프로젝트 생성 단계에도 그대로 선다.
    configFiles:
      Debug: Accentury/Config/Debug.xcconfig
      Release: Accentury/Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Universal Links 입구 (KAN-32 3단계). 안드로이드 매니페스트의 `autoVerify` VIEW
        # intent-filter 자리다.
        #
        # XcodeGen의 `entitlements:` 키가 아니라 빌드 설정으로 다는 이유: 그 키를 쓰면
        # XcodeGen이 그 파일의 주인이 돼서 `generate` 때마다 내용을 새로 쓴다 — 손으로 적은
        # 호스트 목록도 주석도 빈 `<dict/>`로 덮인다. Info-{Debug,Release}.plist를 xcconfig의
        # INFOPLIST_FILE로 가리키는 것과 같은 방식으로, plist는 손으로 들고 배선만 여기서 한다.
        #
        # 파일 안의 호스트 목록은 AccenturyCore `Web/AppLink.swift`의 `appLinkOrigins`가 든
        # 것과 같아야 하고, `AppLinkTests`가 그 entitlements 파일을 직접 읽어 대조한다 —
        # 한쪽만 고치면 컴파일도 단위 테스트도 조용한 채로 링크만 죽는다.
        #
        # 실제 검증은 호스트마다 `/.well-known/apple-app-site-association`이 서빙돼야 성립하고
        # (KAN-32 4단계), SPA 리라이트 함수가 그 경로를 예외로 빼 줘야 한다. App ID의
        # Associated Domains capability는 자동 서명이 아카이브 때 붙인다.
        CODE_SIGN_ENTITLEMENTS: Accentury/Accentury.entitlements
      configs:
        # 가짜 마이크 WAV 등 디버그 전용 자산은 릴리스 번들에 넣지 않는다 (KAN-108 §6).
        # 안드로이드는 `src/debug/assets/`가 소스셋으로 갈려 이 일이 저절로 되지만, XcodeGen에는
        # 구성별 소스 목록이 없어서 빌드 설정으로 뺀다 — `FAKE_MIC_ASSET` 키가 Info-Release.plist에
        # 아예 없는 것과 같은 방향의 두 번째 잠금이다(읽는 코드도 `#if DEBUG`라 셋이 겹친다).
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: $(SRCROOT)/Accentury/DebugResources/*
    dependencies:
      - package: AccenturyCore
        product: AccenturyCore
      # 카카오 공유 (KAN-180). Share가 Common·Template을 이미 끌고 오지만 셋 다 적는다 —
      # 우리 코드가 `import KakaoSDKCommon`(initSDK)과 `import KakaoSDKTemplate`(피드 템플릿)을
      # 직접 하므로, 전이 의존에 기대면 SDK가 내부 구성을 바꾸는 날 import가 끊긴다.
      # Alamofire가 Common을 통해 따라 들어온다 — 앱에 처음 들어오는 서드파티 네트워킹
      # 라이브러리이고, 우리 코드는 쓰지 않는다(네이티브 HTTP는 AccenturyCore Net/이 URLSession으로 한다).
      #
      # **AccenturyCore에는 넣지 않는다.** Core는 시뮬레이터 없이 `swift test`로 도는 순수
      # 계층이고, 카카오 SDK는 UIKit·앱 번들(앱 키)에 매여 있다. 순수 판정(어느 통로로 갈지,
      # 시트에 실을 문구)은 Core에 두고 SDK 호출만 앱 타깃에 남긴다.
      - package: KakaoOpenSDK
        product: KakaoSDKShare
      - package: KakaoOpenSDK
        product: KakaoSDKTemplate
      - package: KakaoOpenSDK
        product: KakaoSDKCommon
      # 익명 계측·크래시 (KAN-33). 설정 파일이 없어도 **의존성은 늘 붙는다** — 안드로이드가
      # 플러그인만 조건부로 걸고 의존성은 무조건 넣은 것과 같은 판단이다. 링크 대상이 설정 유무에
      # 따라 갈리면 설정 없는 CI가 검증한 바이너리와 스토어로 나가는 바이너리가 달라진다.
      #
      # **`FirebaseAnalytics`가 아니라 `FirebaseAnalyticsCore`다.** 기본 product는 IDFA를
      # 수집하는 `GoogleAppMeasurement`를 물고 오고, Core는 `GoogleAppMeasurementCore`를 물어
      # 광고 식별자 수집 코드가 바이너리에 들어오지 않는다. 안드로이드가 매니페스트 플래그로 끄는
      # 자리를 iOS는 이 선택으로 대신한다 — 켤 수 있는 코드가 없는 편이 플래그보다 강하고,
      # App Store 개인정보 라벨(KAN-175)에 적을 항목도 그만큼 줄어든다. import 이름은 그대로
      # `FirebaseAnalytics`다(같은 모듈을 물고 측정 라이브러리만 갈린다).
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
    # dSYM 업로드 (KAN-33). 심볼화되지 않은 스택은 프레임이 전부 16진수 주소라 읽을 수 없고,
    # 티켓 AC("iOS 스택이 심볼화돼 있다")가 정확히 이 단계에 걸린다.
    #
    # `postCompileScripts`가 아니라 `postBuildScripts`인 이유: dSYM은 링크가 끝나고 dsymutil이
    # 돌아야 생긴다. 컴파일 직후에 부르면 늘 빈손이다.
    #
    # 스크립트가 `inputFiles`를 요구하는 것은 Xcode 15부터다. ENABLE_USER_SCRIPT_SANDBOXING이
    # 켜져 있으면(Base.xcconfig) 선언하지 않은 경로는 스크립트가 읽지 못하는데, 이 목록이 그
    # 선언이다 — 하나라도 빠지면 샌드박스가 조용히 막아 업로드만 안 된다. 그래서 끄는 대신 적는다.
    postBuildScripts:
      - name: Crashlytics dSYM 업로드
        script: |
          set -euo pipefail
          # 스크립트가 실제로 읽는 것은 **번들에 복사된** 설정 파일이다. 소스 폴더의 것이 아니라
          # 이쪽을 보는 이유는 아래 inputFiles와 같은 경로여야 샌드박스가 열어 주기 때문이다.
          # 설정이 없는 빌드가 정상 상태이므로(FirebaseSetup) 여기서 죽이지 않는다 — 갓 클론한
          # 기계와 CI가 빌드조차 못 하게 되고, 그때 잃는 것은 dSYM 업로드 하나뿐이다.
          if [ ! -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist" ]; then
            echo "warning: GoogleService-Info.plist가 없어 dSYM 업로드를 건너뛴다 (KAN-33)"
            exit 0
          fi
          # SwiftPM 체크아웃 경로. 아직 패키지를 받지 않았거나 Firebase를 떼어낸 빌드에서는 없다.
          RUN_SCRIPT="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ ! -f "$RUN_SCRIPT" ]; then
            echo "warning: Crashlytics run 스크립트를 찾지 못해 dSYM 업로드를 건너뛴다 (KAN-33)"
            exit 0
          fi
          "$RUN_SCRIPT"
        # 경로 목록은 파이어베이스 문서가 정한 다섯이다. 하나라도 빠지면 샌드박스가 막아
        # «Could not get GOOGLE_APP_ID»처럼 원인이 한참 먼 오류로 나타난다 (실제로 밟았다).
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(TARGET_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist
          # 어느 Firebase 앱에 붙일 dSYM인지를 스크립트가 여기서 읽는다.
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          # 이미 올린 dSYM을 다시 올리지 않으려고 실행 파일의 UUID를 본다. 바이너리를 업로드하지는 않는다.
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        # 출력이 없는 단계라 Xcode가 «매번 돈다»고 경고하는데, 매번 도는 것이 맞다 — 올릴 dSYM이
        # 있는지는 스크립트가 봐야 안다. 가짜 출력을 만들어 경고만 지우면 두 번째 아카이브가
        # 통째로 건너뛰어져 심볼이 빠진 채 나간다.
        basedOnDependencyAnalysis: false

  AccenturyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AccenturyTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.accentury.app.tests
    dependencies:
      - target: Accentury

schemes:
  Accentury:
    build:
      targets:
        Accentury: all
    run:
      config: Debug
    test:
      config: Debug
      # 앱 계층(AccenturyTests)과 순수 Swift 계층(AccenturyCoreTests)을 한 스킴에서 같이 돌린다.
      # Core 쪽은 `cd AccenturyCore && swift test`로도 도는데, 그쪽이 시뮬레이터 없이 훨씬 빠르다.
      targets:
        - AccenturyTests
        - package: AccenturyCore/AccenturyCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
