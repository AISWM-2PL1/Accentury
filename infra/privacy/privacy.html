<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 검색 결과에 자리표시자가 올라가지 않게 막는다. 확정 본문(KAN-176)으로 교체할 때 이 줄을 지운다. -->
    <meta name="robots" content="noindex" />
    <title>개인정보처리방침 - Accentury</title>
    <style>
      /* 이 페이지는 web/ 번들과 무관하게 홀로 서야 한다 (S3 업로드 하나로 교체되는 것이 이 티켓의 AC다).
         그래서 외부 CSS, 외부 글꼴, 스크립트를 하나도 쓰지 않는다. */
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 2.5rem 1.25rem 4rem;
        background: #faf7f2;
        color: #2b2723;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR",
          "Malgun Gothic", sans-serif;
        line-height: 1.7;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 1.5rem;
      }
      p {
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>개인정보처리방침</h1>
      <p>이 문서는 준비 중입니다.</p>
      <p>
        Accentury 사투리 레벨테스트의 개인정보처리방침 확정 본문은 작성이 끝나는 대로 이 주소에
        게시됩니다. 주소는 바뀌지 않습니다.
      </p>
    </main>
  </body>
</html>
