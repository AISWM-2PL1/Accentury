# 운영용 compose (KAN-124). staging과 prod가 이 파일 하나를 그대로 쓴다 - 환경 차이는
# /run/accentury/*.env(부팅마다 SSM Parameter Store에서 읽는 값)뿐이다. Terraform이
# user_data로 EC2의 /opt/accentury/docker-compose.yml에 놓으므로, 이 파일을 고치면
# 인스턴스가 교체된다 (compute/main.tf의 user_data_replace_on_change - 호스트는 무상태다).
# 로컬 풀스택(BE + AI + DB)은 이 파일이 아니라 레포 루트의 docker-compose.yml이다.
#
# 값이 채워지는 경로 (accentury-up.sh가 매 기동마다 만든다):
#   compose.env  - ECR_REGISTRY, IMAGE_TAG. 아래 image: 보간에만 쓰이고 컨테이너에는 안 들어간다.
#   backend.env  - SSM ${prefix}/* 중 나머지 전부 (SPRING_DATASOURCE_*, ACCENTURY_* 등, KAN-129).
#   ai.env       - SSM ${prefix}/ACCENTURY_AI_* (스텁은 비어 있어도 뜬다).
#
# [배포 제약 - backend 컨테이너 1개, ai 워커 1개. scale 금지]
# backend는 다음 상태를 전부 프로세스 메모리에 둔다. 인스턴스나 컨테이너가 둘이면 상태가
# 갈라져 요청 제한이 두 배로 풀리고, 회로 차단기가 서로 다른 판단을 내리며, 혼잡 판정이
# 절반만 본다.
#   - 요청 제한 5축 (RateLimits: 세션 생성 IP, 업로드 IP, 업로드 세션, 어휘 세션, 완료)
#   - AI 회로 차단기 (AiCircuitBreaker: 닫힘/열림/반열림 상태와 연속 실패 카운터)
#   - pollAfterMs 혼잡 판정 (진행 중 AI 전달 건수 임계치)
#   - 분석 디스패처 풀 (dispatch-concurrency 4워커의 인메모리 큐)
# ai는 임시 디렉터리 하나를 프로세스 하나가 전용으로 쓴다 (KAN-27) - 워커를 늘리면 기동 시
# 도는 잔여물 정리가 형제 워커가 처리 중인 오디오를 지운다. --workers 1은 ai/Dockerfile이
# 고정한다. 같은 내용을 infra/README.md "설계 결정 기록"에도 적어 뒀다.

# 네트워크 (KAN-129). ai는 internal 네트워크에만 붙는다 - 기본 게이트웨이가 없어 인터넷도, 인스턴스
# 메타데이터(169.254.169.254)도 닿지 않는다. backend가 Secrets Manager를 읽으려고 IMDSv2 hop limit을
# 2로 올렸는데(compute/main.tf), 그 값은 bridge 안 컨테이너 전부에 인스턴스 프로파일 자격 증명을
# 열어 준다. 신뢰하지 않는 오디오를 처리하는 ai가 뚫리면 RDS 시크릿과 관리자 토큰까지 읽는 자격
# 증명이 새는 것이라, ai는 그 경로 자체를 끊는다 (Codex P1). backend는 두 네트워크에 다 붙어
# ai(http://ai:8000, 내장 DNS)와 AWS API를 모두 본다. 실모델(KAN-22)이 런타임에 밖을 봐야 하면
# 그때 필요한 목적지만 여는 쪽으로 다시 판단한다 - 이미지 빌드 시점의 다운로드는 영향이 없다.
networks:
  backend_ai:
    internal: true

# 로그 로테이션 - 호스트 디스크(20GB)가 컨테이너 로그로 차지 않게 서비스당 50MB로 막는다.
x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  ai:
    image: ${ECR_REGISTRY}/accentury/ai:${IMAGE_TAG}
    # 호스트 재부팅이나 프로세스 사망 뒤 docker가 다시 띄운다. `docker compose stop`으로 사람이
    # 내린 경우만 예외다 (always면 점검 중에도 되살아난다).
    restart: unless-stopped
    # 포트를 발행하지 않는다 - backend만 compose 내부 네트워크(http://ai:8000)로 호출한다 (AC).
    # 디버깅으로 직접 찔러 봐야 하면 SSM 세션 안에서 `docker compose exec backend ...`를 쓴다.
    networks: [backend_ai]
    env_file:
      - path: /run/accentury/ai.env
        required: false
        # raw: 값을 글자 그대로 넘긴다. 기본 형식은 $VAR 보간, 따옴표 벗기기, " #" 주석 처리를
        # 하므로 SSM 값(특히 RDS가 생성한 비밀번호, 구두점 필수 28자)이 조용히 바뀐다 (Codex P1).
        format: raw
    logging: *log
    healthcheck:
      # slim 이미지에는 curl도 wget도 없다 - 이미 있는 파이썬으로 확인한다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v0/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      # 스텁은 즉시 뜨지만 실모델(KAN-22)이 적재를 붙이면 그 시간만큼 여유가 필요하다.
      start_period: 30s

  backend:
    image: ${ECR_REGISTRY}/accentury/backend:${IMAGE_TAG}
    restart: unless-stopped
    networks: [default, backend_ai]
    depends_on:
      ai:
        condition: service_healthy
    env_file:
      - path: /run/accentury/backend.env
        format: raw # ai.env와 같은 이유 - 비밀번호의 $, 따옴표, #를 보존한다.
    # 호스트 8080을 ALB 대상 그룹(instance:8080, KAN-125)이 두드린다. 전 인터페이스 바인딩이지만
    # ec2-sg가 alb-sg 소스만 허용하므로(KAN-121) 인터넷에서는 닿지 않는다.
    ports: ["8080:8080"]
    # t3.small 2GB에서 JVM이 호스트 메모리를 통째로 보지 않게 한도를 둔다. 힙은 이 값의 75%
    # (backend/Dockerfile MaxRAMPercentage) = 768MB. KAN-120 실측이 권한 하한 1GB다 - 나머지
    # 25%로 메타스페이스, 스레드 스택, 코드 캐시, 네이티브 버퍼를 감당한다. ai 스텁(약 35MB)과
    # OS, docker가 남은 1GB를 쓴다. 실모델이 들어오면 ai에도 한도를 잡는다 (KAN-22).
    mem_limit: 1g
    logging: *log
    healthcheck:
      # JRE 이미지에도 curl이 없다 - bash의 /dev/tcp로 직접 HTTP를 말한다 (KAN-131).
      # 상태줄의 200까지 확인해야 "포트만 열리고 컨텍스트는 못 뜬" 기동 실패를 healthy로
      # 오인하지 않는다. ALB 대상 그룹 헬스체크(KAN-125)와 같은 경로다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 6
      # Flyway 마이그레이션 + 컨텍스트 기동. 로컬 실측 2.8초지만 t3.small은 더 느리다.
      start_period: 60s
