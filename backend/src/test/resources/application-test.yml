# 테스트 전용 "차이"만 담는다 (프로파일: test).
#
# 파일 이름이 main의 application.yml과 달라서 통째 대체가 아니라 덮어쓰기다 -
# 여기 없는 설정은 main 값을 그대로 물려받는다. 값을 복사해 두면 main이 바뀔 때
# 조용히 갈라져 테스트가 실제 배포 설정을 검증하지 못하게 되므로 중복을 두지 않는다.
#
# 프로파일 활성화는 IntegrationTest(@ActiveProfiles)가 맡는다.
# 테스트 DB는 Testcontainers PostgreSQL이다 (KAN-123 확정 - H2 호환 모드 폐기).
# 접속 정보는 IntegrationTest가 import하는 PostgresTestcontainer의 @ServiceConnection이
# 공급하고, 이것이 spring.datasource.* 프로퍼티보다 우선한다. ddl-auto는 main의 validate를
# 그대로 물려받는다 - 스키마는 테스트에서도 Flyway V1이 만들고, 마이그레이션이 실제
# PostgreSQL에서 도는 것을 모든 테스트 실행(로컬, CI)이 검증한다.
spring:
  # 가드 값이다 - 컨테이너가 결선된 컨텍스트에서는 @ServiceConnection에 밀려 아예 안 읽힌다.
  # PostgresTestcontainer를 import하지 않은 전체 컨텍스트 테스트가 main의 datasource
  # (로컬 개발 PostgreSQL)로 조용히 흘러가 개발 DB를 읽고 쓰는 사고를, 존재하지 않는
  # 호스트로 즉시 실패하게 해서 막는다 (.invalid는 예약 TLD라 절대 해석되지 않는다).
  datasource:
    url: jdbc:postgresql://import-postgres-testcontainer.invalid:5432/accentury
    username: none
    password: none
    # 컨텍스트마다 풀이 생기므로 기본값(10)이면 공유 컨테이너의 접속 상한을 빨리 소진한다.
    # 테스트는 사실상 단일 스레드라 작은 풀로 충분하다 (@ServiceConnection이 URL은 덮어써도
    # 풀 설정은 이 프로퍼티를 그대로 쓴다).
    hikari:
      maximum-pool-size: 5
  # 테스트 전용 발행본을 얹는다 (KAN-26) - db/testdata의 V900이 구버전 픽스처 gn-2026.07.0을
  # 넣는다. 발행 입력이 DB로 바뀌었으므로(2026-08-09 확정) 픽스처도 운영과 같은 경로인
  # 마이그레이션을 타야 한다. 기본 경로를 다시 적는 것은 이 설정이 추가가 아니라 대체라서다.
  flyway:
    locations: classpath:db/migration,classpath:db/testdata

accentury:
  # 요청 제한 다섯 축을 전부 넉넉히 열어 둔다 - 제한 자체의 동작은 한도를 낮춘 전용 테스트가
  # 검증하고, 나머지 테스트는 제한에 걸리지 않아야 한다 (명세서 §2.5, KAN-28).
  session:
    rate-limit-per-minute: 10000    # 테스트마다 세션을 새로 만들기 때문에 특히 넉넉해야 한다.
  upload:
    rate-limit-per-minute: 10000
    session-rate-limit-per-minute: 10000
    # 같은 머신에서 개발 서버가 함께 떠 있어도 서로의 임시 디렉터리를 보지 않게 분리한다 (KAN-27).
    # 보존 기간(temp-retention)과 multipart 설정은 main 값을 그대로 검증한다.
    temp-dir: ${java.io.tmpdir}/accentury-voice-tmp-test
  vocab:
    rate-limit-per-minute: 10000
  completion:
    rate-limit-per-minute: 10000
  cors:
    allowed-origins: ["https://web.test"]    # CORS 테스트용 오리진
  # MockMvc와 RANDOM_PORT 테스트의 접속 IP가 127.0.0.1이다 - 이걸 신뢰 프록시로 둬야
  # X-Forwarded-For로 IP를 갈라 쓰는 제한 테스트가 성립한다. 신뢰하지 않는 접속의 헤더를
  # 무시하는지는 ClientIpsTest가 따로 검증한다 (KAN-28).
  trusted-proxies: ["127.0.0.1/32", "::1/128"]
