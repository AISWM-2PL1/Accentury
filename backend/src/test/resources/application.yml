# 테스트 전용 설정 - Docker PostgreSQL 없이 인메모리 H2로 실행 (CI에서도 통과)
# PostgreSQL 호환 모드로 방언 차이를 최소화한다.
spring:
  datasource:
    url: jdbc:h2:mem:accentury;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  # main과 동일하게 둔다 - 여기 없으면 file-size-threshold가 기본값 0으로 돌아가
  # 오디오가 임시파일로 떨어지는 상태에서 테스트가 돌게 된다 (FR-DP-01)
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
      file-size-threshold: 2MB

# 이 파일이 main의 application.yml을 통째로 대체하므로(같은 classpath 이름) 여기에 없는 설정은
# 테스트에서 springdoc 기본값으로 돌아간다. OpenApiDocsTest가 실제 설정을 검증하도록 main과 같게 둔다.
springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none
  default-produces-media-type: application/json

# 세션 테스트가 검증하는 고정값 (main과 동일)
accentury:
  test-version: gn-2026.08.1
  score-version: sv-0.3
  session:
    ttl: 30m
  analysis:
    poll-after-ms: 800
    retention: 24h
  upload:
    rate-limit-per-minute: 10000    # 업로드 API 테스트가 걸리지 않게 넉넉히 - 제한 동작은 전용 테스트에서 검증
  cors:
    allowed-origins: ["https://web.test"]    # CORS 테스트용 오리진
