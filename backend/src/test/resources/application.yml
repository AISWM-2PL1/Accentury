# 테스트 전용 설정 — Docker PostgreSQL 없이 인메모리 H2로 실행 (CI에서도 통과)
# PostgreSQL 호환 모드로 방언 차이를 최소화한다.
spring:
  datasource:
    url: jdbc:h2:mem:accentury;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

# 세션 테스트가 검증하는 고정값 (main과 동일)
accentury:
  test-version: gn-2026.08.1
  score-version: sv-0.3
  session:
    ttl: 30m
  analysis:
    poll-after-ms: 800
    retention: 24h
  upload:
    rate-limit-per-minute: 10000    # 업로드 API 테스트가 걸리지 않게 넉넉히 - 제한 동작은 전용 테스트에서 검증
  cors:
    allowed-origins: ["https://web.test"]    # CORS 테스트용 오리진
