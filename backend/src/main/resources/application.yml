spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/accentury
    username: postgres
    password: local
  jpa:
    hibernate:
      ddl-auto: update    # 개발 단계 한정 — 운영 전에 마이그레이션 도구로 교체
    open-in-view: false

# 모든 로그 줄에 correlation ID 포함 — 요청 단위 추적 (KAN-38, Codex 리뷰 P2)
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [%X{correlationId:-}] --- [%15.15t] %-40.40logger{39} : %m%n"

# 활성 테스트·점수 버전 — 세션은 생성 시점 버전에 고정 (명세서 §5.4)
# 프로토타입은 설정 파일로 관리, 버전 발행·활성 전환은 KAN-26에서 DB로 이동
accentury:
  test-version: gn-2026.08.1
  score-version: sv-0.3
  session:
    ttl: 30m    # 토큰 수명 — 테스트 소요 5분의 여유 배수 (명세서 §2.1·§7)
  analysis:
    poll-after-ms: 800    # 상태 폴링 간격 - 서버가 통제, 부하 상승 시 상향 (명세서 §5.3)
  upload:
    rate-limit-per-minute: 30    # IP당 분당 업로드 상한 - 부하 테스트 후 확정 (명세서 §7, KAN-28)
  cors:
    allowed-origins: []    # 스탠드얼론 웹 테스트(KAN-31) 오리진 - 웹 배포 시 지정 (명세서 §2.5)