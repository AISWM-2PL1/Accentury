spring:
  # 업로드 오디오가 디스크에 닿지 않게 한다 (FR-DP-01, Codex sol 리뷰 P1)
  # file-size-threshold >= max-request-size라 모든 파트가 메모리에서 처리되고 임시파일이 생기지 않는다
  servlet:
    multipart:
      max-file-size: 1MB        # §3.3 오디오 상한과 일치 - 초과는 413 AUDIO_TOO_LARGE로 매핑된다
      max-request-size: 2MB     # audio + meta + multipart 오버헤드
      file-size-threshold: 2MB
  datasource:
    url: jdbc:postgresql://localhost:5432/accentury
    username: postgres
    password: local
  jpa:
    hibernate:
      ddl-auto: update    # 개발 단계 한정 - 운영 전에 마이그레이션 도구로 교체
    open-in-view: false
  task:
    execution:
      mode: force    # analysisExecutor(4워커 AI 전달 풀) 정의가 applicationTaskExecutor 자동
                     # 구성을 밀어내지 않게 강제한다 - 밀리면 MVC 비동기가 무제한 스레드로
                     # 떨어지고, 미래의 @Async가 AI 전달 풀에 얹힌다 (Codex 리뷰)

# 모든 로그 줄에 correlation ID 포함 - 요청 단위 추적 (KAN-38, Codex 리뷰 P2)
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [%X{correlationId:-}] --- [%15.15t] %-40.40logger{39} : %m%n"

# 활성 테스트와 점수 버전 - 세션은 생성 시점 버전에 고정 (명세서 §5.4)
# 프로토타입은 설정 파일로 관리, 버전 발행과 활성 전환은 KAN-26에서 DB로 이동
accentury:
  test-version: gn-2026.08.1
  score-version: sv-0.3
  session:
    ttl: 30m    # 토큰 수명 - 테스트 소요 5분의 여유 배수 (명세서 §2.1, §7)
  analysis:
    poll-after-ms: 800               # 상태 폴링 간격 - 서버가 통제, 부하 상승 시 상향 (명세서 §5.3)
    congested-poll-after-ms: 3000    # 혼잡 시 폴링 간격 - 분석이 밀릴 때 폴링 증폭을 막는다 (명세서 §5.3, KAN-24)
    congestion-threshold: 30         # 혼잡 판정 - 진행 중 분석 전달이 이 건수 이상이면 간격 상향
    retention: 24h                   # 분석 작업 보존 기간 - 세션, 결과와 동일 (명세서 §5.5)
    processing-timeout: 60s          # 실행 잔류 한도 - 실행 시작 후 이 시간을 넘기면 RETRYABLE_FAILED(ANALYSIS_TIMEOUT) (KAN-24)
    queued-timeout: 5m               # 큐 유실 한도 - 실행을 시작 못 한 채 이 시간이 지나면 정리 (프로세스 사망 대비).
                                     # 정상 큐 소진(수 분)보다 길고, 세션 TTL(30분) 안에 복구가 보이도록 그보다 짧다
    # ai-base-url: http://localhost:8000    # AI 서버(FastAPI, 명세서 §4.1) - 미설정이면 전달하지 않는 개발 모드 (KAN-22, 36 배포 시 지정)
    ai-timeout: 10s                  # AI 호출 연결과 읽기 타임아웃 - 추론 P95 3초의 여유 배수
    ai-retries: 2                    # AI 일시 장애(연결 실패, 5xx) 재전송 횟수 - 전달 시점에만 가능 (FR-DP-01)
    dispatch-concurrency: 4          # 분석 전달 워커 수 - GPU 동시 슬롯을 넘지 않게 (명세서 §5.3)
  upload:
    rate-limit-per-minute: 30    # IP당 분당 업로드 상한 - 부하 테스트 후 확정 (명세서 §7, KAN-28)
  completion:
    rate-limit-per-minute: 120   # 세션당 분당 /complete 상한 (KAN-16 AC) - pollAfterMs 800ms를 그대로 따르는
                                 # 합법 폴링(약 75회/분)이 60초 분석 대기 중에도 걸리지 않는 여유 배수.
                                 # 임계치는 부하 테스트 후 확정 (명세서 §5.3, §7, KAN-28)
  cors:
    allowed-origins: []    # 스탠드얼론 웹 테스트(KAN-31) 오리진 - 웹 배포 시 지정 (명세서 §2.5)
  # /result 등급별 자산 (명세서 §3.7, KAN-25) - 서버가 내려주므로 앱 배포 없이 여기서 교체 (KAN-29/30)
  # 기동 시 5개 등급 전부 존재해야 한다 (TierAssets 검증). 코멘트, 문구, 이미지는 더미다 -
  # KAN-29/30 확정 자산이 나오면 교체한다. 키는 등급 code의 소문자다 (relaxed binding이
  # 대문자 키를 보존하지 않으므로 소문자로 적고, 조회가 대소문자를 무시한다)
  result:
    web-test-url: https://accentury.app/t?c=kko_share    # 공유 유입 계측 캠페인 파라미터가 붙은 완성 URL (2026-08-14 확정 - 전 등급 공통 고정값, KAN-30)
    tiers:
      outsider:
        comment: "억양도 단어도 아직 표준어에 가깝습니다. 경남 사투리 입문을 환영합니다."
        image-url: https://static.accentury.app/tier/outsider.png
        share-text: "나는 외지인! 너도 시도해볼래?"
      traveler:
        comment: "여행에서 주워들은 사투리가 조금 묻어 있습니다. 아직은 손님 티가 납니다."
        image-url: https://static.accentury.app/tier/traveler.png
        share-text: "나는 여행객! 너도 시도해볼래?"
      wannabe:
        comment: "사투리를 쓰고 싶은 마음은 가득한데 억양이 아직 따라오지 못했습니다."
        image-url: https://static.accentury.app/tier/wannabe.png
        share-text: "나는 사투리 호소인! 너도 시도해볼래?"
      honorary:
        comment: "억양은 거의 토박이인데 단어에서 들켰습니다."
        image-url: https://static.accentury.app/tier/honorary.png
        share-text: "나는 명예주민! 너도 시도해볼래?"
      native:
        comment: "억양도 단어도 완벽한 경남 토박이입니다. 더 배울 것이 없습니다."
        image-url: https://static.accentury.app/tier/native.png
        share-text: "나는 경남 토박이! 너도 시도해볼래?"